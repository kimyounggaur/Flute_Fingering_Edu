<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#20283a">
<meta name="description" content="플루트 37음 운지를 3D 플루트와 손가락 모션으로 확인하는 학습 화면">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320283a'/%3E%3Cpath d='M10 32h44' stroke='%23e8f0f4' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='32' r='8' fill='%23b8893a' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='42' cy='32' r='8' fill='%233498db' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="modulepreload" href="vendor/three-0.170.0/three.module.min.js">
<title>3D 운지 보기 · 플루트 계이름 운지법 배우기</title>
<style>
/* ===== 토큰 — index.html "FINAL MOBILE APP SHELL"과 같은 값 ===== */
:root{
  --app-bg:#f5f7fa;
  --surface:#ffffff;
  --surface-soft:#eef2f6;
  --ink:#20283a;
  --muted:#5f6877;
  --line:#d8dee8;
  --accent:#b8893a;
  --danger:#c23b32;
  --success:#18845b;
  --focus:#1d6fd8;
  --radius:8px;
  --tap:48px;
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  --topbar-h:52px;
  --c-thumb:#e74c3c;
  --c-left:#3498db;
  --c-right:#2ecc71;
  --c-trill:#f39c12;
  --c-pinky:#9b59b6;
}
*{box-sizing:border-box;margin:0;padding:0;letter-spacing:0}
html{background:var(--app-bg);overflow-x:clip}
body{
  min-height:100vh;min-height:100dvh;background:var(--app-bg);color:var(--ink);overflow-x:clip;
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  padding-bottom:var(--safe-bottom)
}
button,select,input{font-family:inherit;font-size:16px}
button{touch-action:manipulation}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}
.icon{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.icon-sm{width:18px;height:18px}
.icon-button{
  min-width:var(--tap);min-height:var(--tap);padding:0;border:1px solid transparent;border-radius:var(--radius);
  background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer
}
.icon-button:hover{background:var(--surface-soft);border-color:var(--line)}
.icon-button[aria-pressed="true"]{background:#f8f1e5;border-color:var(--accent);color:#7a581d}
.icon-button:disabled{opacity:.32;cursor:not-allowed}
.secondary-button{
  min-height:var(--tap);padding:8px 13px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);color:var(--ink);font-weight:750;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  text-decoration:none;font-size:.9rem
}
.secondary-button:hover{border-color:var(--accent)}
button:focus-visible,a:focus-visible,summary:focus-visible,canvas:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ===== 상단 바 ===== */
#app-topbar{
  position:sticky;top:0;z-index:30;height:var(--topbar-h);padding:0 10px;gap:8px;
  display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);backdrop-filter:blur(12px)
}
.app-brand{display:flex;align-items:center;gap:9px;min-width:0;font-size:1rem;font-weight:800}
.app-brand h1{font:inherit;margin:0;display:flex;align-items:center;gap:6px;min-width:0}
.app-brand-mark{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.app-brand-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge-3d{flex:0 0 auto;padding:2px 7px;border-radius:999px;background:var(--ink);color:#fff;font-size:.68rem;font-weight:850;line-height:1.4}
.back-link{min-height:40px;padding:6px 11px 6px 7px;font-size:.84rem}

/* ===== 본문 ===== */
main#app-main{width:min(100%,1280px);margin:0 auto;padding:8px 10px 24px;display:flex;flex-direction:column;gap:8px}
#note-info{
  margin:0;padding:10px 12px;min-height:86px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px
}
#note-info .ni-main{min-width:0}
#note-info .ni-title-row{display:flex;align-items:baseline;gap:7px;min-width:0}
#note-info .ni-name{font-size:1.55rem;line-height:1.05;font-weight:850;white-space:nowrap}
#note-info .ni-count{font-size:.75rem;color:var(--muted);font-weight:650;white-space:nowrap}
#note-info .ni-ko{font-size:.82rem;color:var(--muted);margin-top:3px}
#note-info .tip-disclosure{margin-top:5px;font-size:.78rem;color:var(--muted);max-width:100%}
#note-info .tip-disclosure summary{
  min-height:44px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#5f543f;list-style:none
}
#note-info .tip-disclosure summary::-webkit-details-marker{display:none}
#note-info .tip-disclosure p{padding:6px 0 2px;line-height:1.45;color:var(--ink)}
#note-info .summary-actions{display:flex;align-items:center;gap:6px}
#note-info .alt-tabs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;padding-top:7px;border-top:1px solid var(--surface-soft)}
.alt-tab{min-height:44px;padding:7px 11px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);font-size:.82rem;font-weight:700;cursor:pointer}
.alt-tab[aria-pressed="true"]{border-color:var(--accent);background:#f8f1e5;box-shadow:inset 0 0 0 1px var(--accent)}

#viewer{display:flex;flex-direction:column;gap:8px}
#view-segment{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
#view-segment::-webkit-scrollbar{display:none}
.camera-button{
  flex:1 0 auto;min-height:var(--tap);min-width:60px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer
}
.camera-button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);background:#f8f1e5;box-shadow:inset 0 0 0 1px var(--accent)}
#stage3d{
  position:relative;height:clamp(250px,40dvh,420px);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  background:linear-gradient(180deg,#fdfefe 0%,#eef2f6 64%,#e1e7ed 100%);contain:layout paint
}
#stage3d canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.stage-label{
  position:absolute;left:8px;top:8px;max-width:calc(100% - 200px);padding:6px 10px;border-radius:var(--radius);
  background:rgba(255,255,255,.9);border:1px solid var(--line);font-size:.78rem;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none
}
.stage-label b{font-size:1rem;color:var(--ink);margin-right:5px}
.view-switch{position:absolute;right:8px;top:8px;display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.92);border:1px solid var(--line)}
.view-chip{min-height:40px;min-width:46px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:.76rem;font-weight:800;cursor:pointer}
.view-chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.stage-hint{position:absolute;right:8px;bottom:6px;font-size:.66rem;color:#7e8794;background:rgba(255,255,255,.8);padding:2px 6px;border-radius:4px;pointer-events:none}
#stage-status{
  position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;
  text-align:center;color:var(--muted);font-size:.88rem;line-height:1.5;background:rgba(245,247,250,.82)
}
#stage-status[hidden]{display:none}
#stage-status .secondary-button{font-size:.86rem}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
#stage-status.is-error .spinner{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

#finger-summary{padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:grid;gap:8px}
.fs-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fs-head strong{font-size:.86rem}
.fs-head span{font-size:.74rem;color:var(--muted);font-weight:650;white-space:nowrap}
.finger-chips{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.finger-chips li{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:var(--surface-soft);font-size:.76rem;font-weight:700;line-height:1.3}
.finger-chips li::before{content:"";flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--dot,#9aa3b0)}
.finger-chips li[data-group="thumb"]{--dot:var(--c-thumb)}
.finger-chips li[data-group="left"]{--dot:var(--c-left)}
.finger-chips li[data-group="right"]{--dot:var(--c-right)}
.finger-chips li[data-group="trill"]{--dot:var(--c-trill)}
.finger-chips li[data-group="pinky"]{--dot:var(--c-pinky)}
.finger-chips li.is-new{box-shadow:inset 0 0 0 1.5px #0d6847}
.finger-chips li.empty{background:transparent;padding-left:0;color:var(--muted)}
.finger-chips li.empty::before{display:none}
.change-summary{font-size:.75rem;line-height:1.45;color:var(--muted)}
.change-on{color:#0d6847}.change-off{color:#9a2e28}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.7rem;color:var(--muted);border-top:1px solid var(--surface-soft);padding-top:7px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* 오른쪽 패널 — 한 장의 카드: ① 옥타브 고르기 ② 그 옥타브 건반 한 줄(가로 배열) ③ 접어 둔 「보기 설정」 */
#side-panel{padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
#selector3d{display:grid;gap:10px;width:100%;max-width:480px;margin:0 auto}
.octave-switch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.octave-btn{
  min-height:52px;padding:6px 4px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--muted);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15
}
.octave-btn b{font-size:.92rem;font-weight:800}
.octave-btn span{font-size:.72rem;font-weight:650}
.octave-btn[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);background:#f8f1e5;box-shadow:inset 0 0 0 1px var(--accent)}
/* 건반: 낮은 음 → 높은 음 순서로 한 줄(1열 횡대). 흰 칸 = 온음, 검은 칸 = 반음(♯).
   12~13개를 한 화면에 다 넣으면 칸이 26px쯤으로 좁아져 누르기 어려우므로, 칸 폭은 터치하기 좋게(44px 이상) 두고 옆으로 밀어 본다.
   한 화면에 6칸 반이 보이도록 폭을 잡아서 일곱 번째 칸이 반쯤 잘려 보이게 — "더 있다"는 표시. 고른 음은 centerActiveKey()가 늘 가운데로 가져온다.
   padding은 고른 칸의 빛(3px)·포커스 링(3px+2px)이 스크롤 영역에 잘리지 않게 하는 여백이고, 좌우 -5px 여백으로 위쪽 옥타브 버튼과 가장자리를 맞춘다. */
.piano{
  position:relative;display:flex;gap:4px;margin:0 -5px;padding:5px 5px 7px;scroll-padding-inline:10px;
  overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#b9c1cd transparent
}
.piano[hidden]{display:none}
.note-btn{
  flex:0 0 clamp(44px,calc((100% - 24px) / 6.5),72px);min-height:64px;padding:3px 2px;border:2px solid var(--line);border-radius:var(--radius);
  background:#fff;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05
}
.note-btn.black{background:var(--ink);border-color:var(--ink);color:#fff}
.note-btn .nb-ko{font-size:.91rem;font-weight:850}
.note-btn .nb-en{font-size:.65rem;color:var(--muted);margin-top:3px;white-space:nowrap}
.note-btn.black .nb-en{color:#c7cfdb}
.note-btn.active,.note-btn.black.active{background:var(--accent);border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 3px rgba(184,137,58,.35)}
.note-btn.active .nb-en,.note-btn.black.active .nb-en{color:inherit}
/* 보기 설정: 기본은 접힘 */
#options3d{margin-top:10px;border-top:1px solid var(--surface-soft)}
#options3d summary{
  min-height:var(--tap);padding:0 4px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  color:var(--muted);font-size:.86rem;font-weight:750;cursor:pointer;list-style:none
}
#options3d summary::-webkit-details-marker{display:none}
#options3d .chev{transition:transform .15s}
#options3d[open] .chev{transform:rotate(180deg)}
.opt-list{display:grid;gap:2px;padding:0 0 4px}
.opt-row{
  width:100%;min-height:54px;padding:6px 6px;border:0;border-radius:var(--radius);background:transparent;color:var(--ink);cursor:pointer;
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left
}
.opt-text{display:grid;gap:2px;min-width:0}
.opt-label{font-size:.9rem;font-weight:750}
.opt-desc{font-size:.74rem;color:var(--muted);line-height:1.35}
.opt-switch{position:relative;flex:0 0 auto;width:44px;height:26px;border-radius:999px;background:#8b95a5;transition:background .15s}
.opt-switch::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s
}
.opt-row[aria-checked="true"] .opt-switch{background:var(--accent)}
.opt-row[aria-checked="true"] .opt-switch::after{transform:translateX(18px)}
.kbd-note{padding:2px 6px 8px;font-size:.72rem;line-height:1.5;color:var(--muted)}
.kbd-note span{white-space:nowrap}
footer{padding:6px 12px 22px;text-align:center;color:#7e8794;font-size:.72rem;line-height:1.5}

/* 모바일: 3D 화면을 상단에 고정해 아래 음 목록을 넘기면서도 계속 보이게 */
@media (max-width:1023px) and (min-height:600px){
  #viewer{position:sticky;top:var(--topbar-h);z-index:10;background:var(--app-bg);padding:6px 0;margin:-6px 0}
}
@media (min-width:768px){
  main#app-main{padding:14px 20px 34px;gap:12px}
  #stage3d{height:clamp(340px,52vh,560px)}
}
@media (min-width:1024px){
  #app-topbar{padding:0 max(20px,calc((100vw - 1240px)/2))}
  main#app-main{
    display:grid;grid-template-columns:minmax(0,1fr) 360px;align-items:start;
    grid-template-areas:"summary summary" "viewer panel" "fingers panel"
  }
  #note-info{grid-area:summary}
  #viewer{grid-area:viewer}
  #finger-summary{grid-area:fingers}
  #side-panel{grid-area:panel;position:sticky;top:calc(var(--topbar-h) + 12px)}
  #stage3d{height:clamp(380px,calc(100dvh - 330px),640px)}
}
@media (hover:hover){
  .octave-btn:hover,.note-btn:not(.active):hover{border-color:var(--accent)}
  .opt-row:hover{background:var(--surface-soft)}
  #options3d summary:hover{color:var(--ink)}
}
@media (hover:none),(pointer:coarse){ .kbd-note{display:none} }
@media (prefers-reduced-motion:reduce){ .spinner{animation:none} #options3d .chev,.opt-switch,.opt-switch::after{transition:none} }
@media (forced-colors:active){
  .camera-button[aria-pressed="true"],.view-chip[aria-pressed="true"],.alt-tab[aria-pressed="true"],
  .octave-btn[aria-pressed="true"],.note-btn.active{outline:3px solid Highlight;outline-offset:-3px}
  .opt-switch{border:2px solid ButtonText;background:Canvas}
  .opt-switch::after{background:ButtonText;box-shadow:none}
  .opt-row[aria-checked="true"] .opt-switch{background:Highlight}
  .opt-row[aria-checked="true"] .opt-switch::after{background:HighlightText;transform:translateX(14px)}
}
</style>
</head>
<body>

<svg class="icon-sprite" aria-hidden="true" focusable="false">
  <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
  <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
</svg>

<div id="app-shell">
<header id="app-topbar">
  <div class="app-brand">
    <span class="app-brand-mark" aria-hidden="true">●</span>
    <h1><span class="app-brand-text">플루트 운지</span><span class="badge-3d">3D</span></h1>
  </div>
  <a id="back-2d" class="secondary-button back-link" href="./?mode=learn"><svg class="icon icon-sm"><use href="#icon-chevron-left"></use></svg>2D 운지표</a>
</header>

<main id="app-main">
  <section id="note-info" aria-label="선택한 음"></section>

  <section id="viewer" aria-label="3D 플루트">
    <div id="view-segment" role="group" aria-label="보는 영역">
      <button class="camera-button" data-region="auto" aria-pressed="true">자동</button>
      <button class="camera-button" data-region="all" aria-pressed="false">전체</button>
      <button class="camera-button" data-region="left" aria-pressed="false">왼손</button>
      <button class="camera-button" data-region="right" aria-pressed="false">오른손</button>
      <button class="camera-button" data-region="foot" aria-pressed="false">새끼·풋</button>
    </div>
    <div id="stage3d">
      <div id="stage-label" class="stage-label" aria-hidden="true"></div>
      <div class="view-switch" role="group" aria-label="시점">
        <button class="view-chip" data-view="player" aria-pressed="true" title="연주자 시점 — 플루트를 들고 내려다보는 방향">연주자</button>
        <button class="view-chip" data-view="mirror" aria-pressed="false" title="거울 시점 — 마주 선 선생님을 보는 방향">거울</button>
        <button class="view-chip" data-view="top" aria-pressed="false" title="위에서 내려다보기">위</button>
      </div>
      <div class="stage-hint" aria-hidden="true">드래그로 회전 · 휠/핀치로 확대</div>
      <div id="stage-status" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <p id="stage-status-text">3D 플루트를 준비하고 있어요…</p>
      </div>
    </div>
  </section>

  <section id="finger-summary" aria-label="누르는 손가락"></section>

  <div id="side-panel">
    <section id="selector3d" aria-label="계이름 선택"></section>
    <details id="options3d">
      <summary><span>보기 설정</span><svg class="icon icon-sm chev" aria-hidden="true"><use href="#icon-chevron-down"></use></svg></summary>
      <div class="opt-list">
        <button class="opt-row" role="switch" aria-checked="true" data-opt="hands" aria-labelledby="opt-hands-l" aria-describedby="opt-hands-d">

        <button class="opt-row" role="switch" aria-checked="false" data-opt="ghost" aria-labelledby="opt-ghost-l" aria-describedby="opt-ghost-d">

  const left = changed.filter(k => ["thumbBb","thumbB","L1","L2","L3","gis"].includes(k)).length;

  const requestRender = () => { if (!rafId) rafId = requestAnimationFrame(frame); };
  function tween({ dur = 220, delay = 0, ease = easeOutCubic, update, done }){
    const tw = { start: performance.now() + delay, dur: reduceMotion ? 0 : dur, ease, update, done, alive:true };
    tweens.add(tw); requestRender(); return tw;
  }
  function stepTweens(now){
    for (const tw of tweens){
      if (!tw.alive){ tweens.delete(tw); continue; }
      let p = tw.dur === 0 ? 1 : (now - tw.start) / tw.dur;
      if (p < 0) continue;
      if (p >= 1){ p = 1; tw.alive = false; }
      tw.update(tw.ease(p));
      if (!tw.alive){ tweens.delete(tw); tw.done && tw.done(); }
    }
  }
  function finishAllTweens(){
    for (const tw of [...tweens]){ tweens.delete(tw); if (tw.alive){ tw.alive = false; tw.update(1); tw.done && tw.done(); } }
  }
  function frame(now){
    rafId = 0;
    stepTweens(now);
    const moved = controls.update();
    renderer.render(scene, camera);
    if (tweens.size || moved) requestRender();
  }
  controls.addEventListener("change", requestRender);

  const jointTweens = new Map();
  function animateFingerTo(f, from, delay){
    const to = f.dofs.map(d => d.get());
    const prev = jointTweens.get(f); if (prev) prev.alive = false;
    f.dofs.forEach((d, i) => d.set(from[i]));
    jointTweens.set(f, tween({ dur: 240 / speed, delay, update: p => f.dofs.forEach((d, i) => d.set(from[i] + (to[i] - from[i]) * p)) }));
  }
  function applyKeyVisual(k){
    const g = k.group, s = k.press;
    if (k.def.kind === "roller") g.position.copy(k.touch).addScaledVector(k.normal, -0.34 - 0.22*s);
    else g.rotation.x = g.userData.sign * 0.22 * s;
    k.mat.emissive.copy(k.color); k.mat.emissiveIntensity = 0.55 * s;
    k.mat.color.setHex(0xe6eaef).lerp(k.color, 0.4 * s);
  }
  function setKeyPressed(id, pressed){
    const k = keys[id]; const to = pressed ? 1 : 0; if (k.target === to) return;
    k.target = to; const from = k.press;
    if (k.tw) k.tw.alive = false;
    k.tw = tween({ dur: 170 / speed, update: p => { k.press = from + (to - from) * p; applyKeyVisual(k); } });
  }
  const ringGroup = new THREE.Group(); scene.add(ringGroup);
  function flashRing(k, on){ // 새로 누른 키 = 초록, 뗀 키 = 빨강 (2D 앱 changed-on/off와 같은 의미)
    const geo = new THREE.TorusGeometry((k.def.r || 0.8) + 0.42, 0.07, 8, 48);
    const mat = new THREE.MeshBasicMaterial({ color: on ? 0x18845b : 0xc23b32, transparent:true, opacity:0.95, depthWrite:false });
    const m = new THREE.Mesh(geo, mat);
    m.position.copy(k.touch).addScaledVector(k.normal, 0.25);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), k.normal);
    ringGroup.add(m);
    tween({ dur: 1300 / speed, ease: p => p, update: p => { m.scale.setScalar(1 + 0.45*p); mat.opacity = 0.95 * (1 - p); },
      done: () => { ringGroup.remove(m); geo.dispose(); mat.dispose(); } });
  }
  let handShiftTw = null, shiftVisualR = 0;
  function animateHandShift(shift){
    const from = shiftVisualR;
    placeHand("R", shift); // 솔버는 최종 위치 기준
    if (Math.abs(shift - from) < 1e-3){ shiftVisualR = shift; return; }
    if (handShiftTw) handShiftTw.alive = false;
    handShiftTw = tween({ dur: 260 / speed, update: p => { shiftVisualR = from + (shift - from) * p; placeHand("R", shiftVisualR); } });
  }

  /* ----- 운지 표시: 키 눌림 → 오른손 위치 → 손가락 솔브 → 트윈 ----- */
  let shownKeys = [];
  function show(ks, { on = [], off = [], diff = false } = {}){
    const before = new Set(shownKeys), after = new Set(ks);
    KEY_IDS.forEach(id => setKeyPressed(id, after.has(id)));
    if (diff){ on.forEach(id => flashRing(keys[id], true)); off.forEach(id => flashRing(keys[id], false)); }
    animateHandShift(after.has("lowC") ? 2.4 : after.has("lowCis") ? 1.2 : 0); // 롤러로 뻗을 때 오른손이 풋 쪽으로
    let stagger = 0;
    for (const side of ["L","R"]){
      for (const [fname, f] of Object.entries(hands[side].fingers)){
        const from = f.dofs.map(d => d.get());
        const pressedKey = FINGER_KEYS[side][fname].find(k => after.has(k));
        let tgt;
        if (side === "R" && fname === "thumb") tgt = RIGHT_THUMB_TARGET;
        else if (pressedKey) tgt = fingerTarget(pressedKey, f, true, side);
        else { const home = FINGER_KEYS[side][fname]; tgt = fingerTarget(home[home.length - 1], f, false, side); }
        if (side === "R" && fname === "index"){ // 검지 옆면 겸직(사이드·트릴 레버)
          const sideKey = SIDE_KEYS.find(k => after.has(k));
          if (sideKey && pressedKey){ const lever = fingerTarget(sideKey, f, true, side); tgt = { t: tgt.t.clone().lerp(lever.t, 0.22), a: tgt.a }; }
          else if (sideKey) tgt = fingerTarget(sideKey, f, true, side);
        }
        solveFinger(f, tgt.t, tgt.a);
        const newlyPressed = pressedKey && !FINGER_KEYS[side][fname].some(k => before.has(k));
        animateFingerTo(f, from, newlyPressed ? (stagger++) * 40 / speed : 0);
      }
    }
    shownKeys = ks.slice();
    requestRender();
  }

  /* ----- 카메라 프리셋 ----- */
  const REGIONS = { all:[-2,69], hands:[21,60], left:[21,42], right:[40,60], foot:[48,68] };
  const VIEWS = { player:{az:0, el:42, dx:0.06}, mirror:{az:180, el:28, dx:0.06}, top:{az:0, el:80, dx:0} };
  let view = "player", framedRegion = "hands", camTw = null;
  function frameFor(region){
    const [x0, x1] = REGIONS[region];
    const box = new THREE.Box3(new THREE.Vector3(x0, -8, -7), new THREE.Vector3(x1, 7, 10)); // 손목까지 포함
    const center = box.getCenter(new THREE.Vector3());
    const v = VIEWS[view]; const az = deg(v.az), el = deg(v.el);
    const dir = new THREE.Vector3(v.dx, Math.sin(el), Math.cos(az) * Math.cos(el)).normalize();
    const fwd = dir.clone().negate();
    const right = new THREE.Vector3().crossVectors(Y_AXIS, fwd).normalize();
    const up = new THREE.Vector3().crossVectors(fwd, right).normalize();
    const vfov = deg(camera.fov), hfov = 2 * Math.atan(Math.tan(vfov/2) * camera.aspect);
    let dist = 0; const c = new THREE.Vector3();
    for (let i = 0; i < 8; i++){
      c.set(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).sub(center);
      const xr = c.dot(right), yr = c.dot(up), zr = c.dot(fwd);
      dist = Math.max(dist, Math.abs(xr) / Math.tan(hfov/2) - zr, Math.abs(yr) / Math.tan(vfov/2) - zr);
    }
    dist *= 1.06;
    center.y += 0.8; // 위쪽 오버레이(음 이름·시점 버튼)와 겹치지 않게 내용을 살짝 아래로
    return { pos: center.clone().addScaledVector(dir, dist), target: center };
  }
  function frameRegion(region, immediate = false){
    framedRegion = region;
    const f = frameFor(region);
    if (camTw){ camTw.alive = false; controls.enabled = true; }
    if (immediate){ camera.position.copy(f.pos); controls.target.copy(f.target); controls.update(); requestRender(); return; }
    const p0 = camera.position.clone(), t0 = controls.target.clone();
    controls.enabled = false;
    camTw = tween({ dur: 520, ease: easeInOut,
      update: p => { camera.position.lerpVectors(p0, f.pos, p); controls.target.lerpVectors(t0, f.target, p); },
      done: () => { controls.enabled = true; } });
  }

  /* ----- 크기 변화 · 컨텍스트 손실 ----- */
  let userCameraHandler = null, keepFraming = () => true;
  function resize(){
    const w = stageEl.clientWidth || 1, h = stageEl.clientHeight || 1;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    if (keepFraming()) frameRegion(framedRegion, true);
    requestRender();
  }
  new ResizeObserver(resize).observe(stageEl);
  controls.addEventListener("start", () => { if (controls.enabled && userCameraHandler) userCameraHandler(); });
  canvas.addEventListener("webglcontextlost", event => {
    event.preventDefault();
    window.flute3dFail("3D 화면이 잠시 멈췄어요. 새로고침해 주세요.");
  });
  resize();

  return {
    show,
    frame: frameRegion,
    get framedRegion(){ return framedRegion; },
    setView(next){ view = next; },
    setHandsVisible(on){ hands.L.group.visible = hands.R.group.visible = on; requestRender(); },
    setGhost(on){
      for (const m of [MAT.skin, MAT.nail]){ m.transparent = on; m.opacity = on ? 0.42 : 1; m.depthWrite = !on; m.needsUpdate = true; }
      requestRender();
    },
    setLabel(text){ canvas.setAttribute("aria-label", text); },
    snap(){ finishAllTweens(); requestRender(); },
    onUserCamera(handler){ userCameraHandler = handler; },
    keepFramingWhen(fn){ keepFraming = fn; },
    debug:{ scene, camera, keys, hands }
  };
}

/* =====================================================================
   4. 화면(UI) — 2D 앱과 같은 컴포넌트·문구 규칙
   ===================================================================== */
const $ = id => document.getElementById(id);
const icon = id => `<svg class="icon" aria-hidden="true"><use href="#icon-${id}"></use></svg>`;

function renderNoteInfo(note, altIndex, ks){
  const index = NOTES.indexOf(note);
  const altTabs = note.alt.length ? `
    <div class="alt-tabs" role="group" aria-label="대체 운지 선택">
      <button class="alt-tab" data-alt="-1" aria-pressed="${altIndex < 0}">기본 운지</button>
      ${note.alt.map((a, i) => `<button class="alt-tab" data-alt="${i}" aria-pressed="${altIndex === i}">${a.name}</button>`).join("")}
    </div>` : "";
  $("note-info").innerHTML = `
    <div class="ni-main">
      <div class="ni-title-row"><div class="ni-name">${note.ko}</div><div class="ni-count">${note.name} · ${ks.length}키</div></div>
      <div class="ni-ko">${note.oct}옥타브 · ${note.id.includes("s") ? "반음" : "온음"}${altIndex >= 0 ? ` · 대체 운지: ${note.alt[altIndex].name}` : ""}</div>
      ${note.tip ? `<details class="tip-disclosure"><summary>${note.tip}</summary><p>${note.tip}</p></details>` : ""}
    </div>
    <div class="summary-actions">
      <button class="icon-button" data-action="previous" ${index === 0 ? "disabled" : ""} aria-label="이전 반음">${icon("chevron-left")}</button>
      <button class="icon-button" id="autoplay-btn" data-action="autoplay" aria-pressed="${autoplay.playing}" aria-label="${autoplay.playing ? "자동 재생 일시정지" : "도레미 자동 재생"}">${icon(autoplay.playing ? "pause" : "play")}</button>
      <button class="icon-button" data-action="next" ${index === NOTES.length - 1 ? "disabled" : ""} aria-label="다음 반음">${icon("chevron-right")}</button>
    </div>
    ${altTabs}`;
}

function renderFingerSummary(ks, on, off, first){
  const chips = ks.length
    ? ks.map(k => `<li data-group="${KEY_GROUP[k]}"${on.includes(k) ? ' class="is-new"' : ""}>${ARIA_FINGER[k]}</li>`).join("")
    : '<li class="empty">없음 — 모든 키를 열어요</li>';
  const onText = on.map(k => ARIA_FINGER[k]).join(", ");
  const offText = off.map(k => ARIA_FINGER[k]).join(", ");
  const change = first ? "첫 음을 선택했어요"
    : (onText || offText)
      ? `${onText ? `<span class="change-on">＋ ${onText}</span>` : ""}${onText && offText ? "<br>" : ""}${offText ? `<span class="change-off">− ${offText}</span>` : ""}`
      : "이전 음과 비교할 변화가 없어요";
  $("finger-summary").innerHTML = `
    <div class="fs-head"><strong>누르는 손가락</strong><span>15키 중 ${ks.length}개 누름</span></div>
    <ul class="finger-chips">${chips}</ul>
    <div class="change-summary">${change}</div>
    <div class="legend" aria-hidden="true">
      <span><i style="background:var(--c-left)"></i>왼손</span><span><i style="background:var(--c-right)"></i>오른손</span>
      <span><i style="background:var(--c-thumb)"></i>엄지</span><span><i style="background:var(--c-trill)"></i>트릴·사이드(검지 옆면)</span>
      <span><i style="background:var(--c-pinky)"></i>새끼 특수키</span>
    </div>`;
}

/* 음 고르기: 옥타브 3칸 + 고른 옥타브의 건반 한 줄만 보여 준다(나머지 둘은 hidden).
   건반은 낮은 음 → 높은 음 순서로 한 줄에 늘어놓는다(반음 단위, 검은 칸 = ♯). 한 줄이 패널보다 길어서 옆으로 밀어 볼 수 있고,
   고른 음은 selectNote()가 centerActiveKey()로 늘 가운데에 가져다 놓는다. */
function buildSelector(){
  const octaveSwitch = `<div class="octave-switch" role="group" aria-label="옥타브">${[1, 2, 3].map(oct =>
    `<button class="octave-btn" data-octave="${oct}" aria-pressed="false"><b>${oct}옥타브</b><span>${OCT_LABELS[oct]}</span></button>`).join("")}</div>`;
  const pianos = [1, 2, 3].map(oct => {
    const keys = NOTES.filter(n => n.oct === oct).map(n => {
      const black = n.id.includes("s");
      return `<button class="note-btn ${black ? "black" : "white"}" data-note="${n.id}" aria-pressed="false" aria-label="${n.oct}옥타브 ${n.ko} ${n.name}">
        <span class="nb-ko">${n.ko.split("/")[0]}</span><span class="nb-en">${n.name.split("/")[0]}</span></button>`;
    }).join("");
    return `<div class="piano" data-piano="${oct}" role="group" aria-label="${oct}옥타브 ${OCT_LABELS[oct]} 건반" hidden>${keys}</div>`;
  }).join("");
  $("selector3d").innerHTML = octaveSwitch + pianos;
}

/* 고른 옥타브의 건반 줄을 펼친다. 다른 옥타브가 새로 펼쳐졌으면 true */
function showOctave(oct){
  let opened = false;
  document.querySelectorAll("#selector3d [data-piano]").forEach(piano => {
    const hide = Number(piano.dataset.piano) !== oct;
    if (piano.hidden !== hide){ piano.hidden = hide; if (!hide) opened = true; }
  });
  document.querySelectorAll("#selector3d .octave-btn").forEach(button =>
    button.setAttribute("aria-pressed", String(Number(button.dataset.octave) === oct)));
  return opened;
}

/* 고른 음(.active)이 건반 줄의 가운데 오도록 줄만 옆으로 민다. scrollIntoView는 페이지까지 움직일 수 있어서 쓰지 않는다.
   처음 그릴 때·옥타브를 바꿀 때·'동작 줄이기' 설정에서는 애니메이션 없이 바로 옮긴다. */
function centerActiveKey(instant){
  const piano = document.querySelector("#selector3d .piano:not([hidden])");
  const key = piano && piano.querySelector(".note-btn.active");
  if (!key) return;
  const room = piano.scrollWidth - piano.clientWidth;
  if (room <= 0) return;
  const left = Math.min(room, Math.max(0, key.offsetLeft + key.offsetWidth / 2 - piano.clientWidth / 2));
  const calm = instant || window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  piano.scrollTo({ left, behavior: calm ? "auto" : "smooth" });
}

function stateQuery(){
  const params = new URLSearchParams({ note: state.noteId || "C4" });
  if (state.altIndex >= 0) params.set("alt", String(state.altIndex));
  return params.toString();
}

function selectNote(noteId, opts = {}){
  const note = noteById(noteId);
  if (!note) return false;
  const source = opts.source || "tap";
  if (autoplay.playing && source !== "autoplay") stopAutoplay();
  const first = state.noteId === null;
  const changingNote = noteId !== state.noteId;
  const altIndex = Number.isInteger(opts.altIndex) ? opts.altIndex : (changingNote ? -1 : state.altIndex);
  const ks = activeKeys(note, altIndex);
  const before = new Set(state.prevKeys), after = new Set(ks);
  const on = first ? [] : ks.filter(k => !before.has(k));
  const off = first ? [] : state.prevKeys.filter(k => !after.has(k));

  if (viewer){
    viewer.show(ks, { on, off, diff: state.opts.diff && !first });
    const changed = [...on, ...off];
    if (!first && opts.animateCam !== false && state.region === "auto" && changed.length) viewer.frame(deriveRegion(changed));
    viewer.setLabel(`3D 플루트: ${note.ko} ${note.name}${altIndex >= 0 ? ` (${note.alt[altIndex].name})` : ""}, 15키 중 ${ks.length}개 누름`);
  }
  state.noteId = noteId; state.altIndex = altIndex; state.prevKeys = ks;

  renderNoteInfo(note, altIndex, ks);
  renderFingerSummary(ks, on, off, first);
  document.querySelectorAll(".note-btn").forEach(button => {
    const active = button.dataset.note === noteId;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
  const octaveOpened = showOctave(note.oct);
  centerActiveKey(first || octaveOpened);
  $("stage-label").innerHTML = `<b>${note.ko}</b>${note.name}${altIndex >= 0 ? ` · ${note.alt[altIndex].name}` : ""}`;
  const link2d = `./?${stateQuery()}&mode=learn`;
  $("back-2d").setAttribute("href", link2d);
  $("fallback-2d")?.setAttribute("href", link2d);
  if (source !== "autoplay"){
    try { history.replaceState(null, "", `${location.pathname}?${stateQuery()}`); } catch (error) { /* Safari 호출 빈도 제한 */ }
  }
  if (opts.announce !== false){
    const fingers = ks.map(k => ARIA_FINGER[k]).join(", ");
    $("aria-status").textContent = `${note.oct}옥타브 ${note.ko}(${note.name}). 누르는 손가락: ${fingers || "없음"}`;
  }
  return true;
}

function stepNote(delta){
  const cur = noteById(state.noteId);
  const target = cur && NOTES.find(n => n.midi === cur.midi + delta);
  if (target) selectNote(target.id, { source:"arrow" });
}

/* 도레미 자동 재생 — 2D 앱과 같은 순서(현재 옥타브의 온음 + 한 옥타브 위 도), 100 BPM */
function buildScaleQueue(){
  const cur = noteById(state.noteId) || NOTES[0];
  const whites = NOTES.filter(n => n.oct === cur.oct && !n.id.includes("s")).map(n => n.id);
  const octaveUpC = NOTES.find(n => n.midi === noteById(whites[0]).midi + 12);
  if (octaveUpC) whites.push(octaveUpC.id);
  return whites;
}
function syncAutoplayButton(){
  const button = $("autoplay-btn");
  if (!button) return;
  button.setAttribute("aria-pressed", String(autoplay.playing));
  button.setAttribute("aria-label", autoplay.playing ? "자동 재생 일시정지" : "도레미 자동 재생");
  button.innerHTML = icon(autoplay.playing ? "pause" : "play");
}
function startAutoplay(){
  stopAutoplay();
  autoplay.queue = buildScaleQueue();
  autoplay.idx = 0;
  autoplay.playing = true;
  if (viewer && state.region === "auto") viewer.frame("hands");
  const step = () => {
    if (!autoplay.playing) return;
    if (autoplay.idx >= autoplay.queue.length){ stopAutoplay(); return; }
    selectNote(autoplay.queue[autoplay.idx++], { source:"autoplay", animateCam:false, announce:false });
    syncAutoplayButton();
    autoplay.timer = setTimeout(step, 600 / speed);
  };
  step();
}
function stopAutoplay(){
  const wasPlaying = autoplay.playing;
  autoplay.playing = false;
  clearTimeout(autoplay.timer);
  autoplay.timer = null;
  syncAutoplayButton();
  if (wasPlaying && state.noteId){
    try { history.replaceState(null, "", `${location.pathname}?${stateQuery()}`); } catch (error) {}
  }
}

function setRegion(region){
  state.region = region;
  document.querySelectorAll("#view-segment .camera-button").forEach(button =>
    button.setAttribute("aria-pressed", String(button.dataset.region === region)));
}

function initialSelection(){
  const params = new URLSearchParams(location.search);
  let id = params.get("note");
  if (!noteById(id)){
    try { // 2D 앱에서 마지막으로 본 음 (읽기만 함)
      const saved = JSON.parse(localStorage.getItem("fluteEdu.v2") || "null");
      if (saved && noteById(saved.lastNoteId)) id = saved.lastNoteId;
    } catch (error) {}
  }
  if (!noteById(id)) id = "C4";
  const alt = Number.parseInt(params.get("alt") ?? "", 10);
  return { id, alt: Number.isInteger(alt) && noteById(id).alt[alt] ? alt : -1 };
}

function bindUi(){
  $("selector3d").addEventListener("click", event => {
    const key = event.target.closest("[data-note]");
    if (key){ selectNote(key.dataset.note, { source:"tap" }); return; }
    const octave = event.target.closest("[data-octave]");
    if (!octave) return;
    // 옥타브를 바꾸면 지금 음을 그 옥타브의 같은 계이름으로 옮긴다 (↑/↓ 키와 같은 동작) — 건반에는 늘 고른 음이 보인다
    const cur = noteById(state.noteId), target = Number(octave.dataset.octave);
    const same = cur && cur.oct !== target && NOTES.find(n => n.oct === target && n.midi % 12 === cur.midi % 12);
    if (same) selectNote(same.id, { source:"tap" });
  });
  $("note-info").addEventListener("click", event => {
    const alt = event.target.closest("[data-alt]");
    if (alt){ selectNote(state.noteId, { source:"tap", altIndex: Number.parseInt(alt.dataset.alt, 10) }); return; }
    const action = event.target.closest("[data-action]")?.dataset.action;
    if (action === "previous") stepNote(-1);
    if (action === "next") stepNote(1);
    if (action === "autoplay") autoplay.playing ? stopAutoplay() : startAutoplay();
  });
  $("view-segment").addEventListener("click", event => {
    const button = event.target.closest("[data-region]");
    if (!button) return;
    setRegion(button.dataset.region);
    if (viewer) viewer.frame(state.region === "auto" ? "hands" : state.region);
  });
  document.querySelector(".view-switch").addEventListener("click", event => {
    const button = event.target.closest("[data-view]");
    if (!button) return;
    state.view = button.dataset.view;
    document.querySelectorAll(".view-chip").forEach(chip => chip.setAttribute("aria-pressed", String(chip === button)));
    if (state.region === "free") setRegion("auto");
    if (viewer){ viewer.setView(state.view); viewer.frame(viewer.framedRegion); }
  });
  document.querySelectorAll("[data-opt]").forEach(button => button.addEventListener("click", () => {
    const key = button.dataset.opt;
    state.opts[key] = !state.opts[key];
    button.setAttribute("aria-checked", String(state.opts[key]));
    if (key === "hands") viewer?.setHandsVisible(state.opts.hands);
    if (key === "ghost") viewer?.setGhost(state.opts.ghost);
    if (key === "slow") speed = state.opts.slow ? 0.4 : 1;
  }));
  /* 키보드: 숫자 1~7 · Shift+1~7 · Alt+1~5 · Alt+6~0으로 바로 고르기(2D 앱과 같음) + ←/→ 반음 · ↑/↓ 옥타브 */
  document.addEventListener("keydown", event => {
    if (event.ctrlKey || event.metaKey || event.isComposing || event.keyCode === 229) return;
    if (event.target instanceof Element && (event.target.matches("input,select,textarea") || event.target.isContentEditable)) return;
    const mod = event.shiftKey ? (event.altKey ? null : "shift") : (event.altKey ? "alt" : "plain");
    const shortcutNote = mod && NOTE_SHORTCUTS[mod][event.code];
    if (shortcutNote){
      event.preventDefault();
      if (!event.repeat) selectNote(shortcutNote, { source:"shortcut" });
      return;
    }
    if (event.shiftKey || event.altKey) return;
    const delta = { ArrowRight:1, ArrowLeft:-1, ArrowUp:12, ArrowDown:-12 }[event.key];
    if (!delta) return;
    const cur = noteById(state.noteId);
    if (cur && NOTES.some(n => n.midi === cur.midi + delta)){ event.preventDefault(); stepNote(delta); }
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) stopAutoplay(); });
  window.addEventListener("pagehide", stopAutoplay);
}

/* =====================================================================
   5. 시작 — UI는 먼저 그리고, 3D는 WebGL 2가 될 때만 붙인다 (안 되면 안내 + 2D 링크)
   ===================================================================== */
function webgl2Available(){
  try { return !!(window.WebGL2RenderingContext && document.createElement("canvas").getContext("webgl2")); }
  catch (error) { return false; }
}

buildSelector();
bindUi();
const start = initialSelection();
showOctave(noteById(start.id).oct);   // 3D를 불러오는 동안에도 처음부터 맞는 옥타브 건반이 보이게
if ("ResizeObserver" in window){      // 화면 폭이 바뀌면(기기 회전·창 크기) 칸 폭도 바뀌므로 고른 음을 다시 가운데로
  let lastWidth = 0;
  new ResizeObserver(entries => {
    const width = Math.round(entries[0].contentRect.width);
    if (width !== lastWidth){ lastWidth = width; centerActiveKey(true); }
  }).observe($("selector3d"));
}

if (!webgl2Available()){
  window.__flute3d.failed = true;
  window.flute3dFail("이 기기·브라우저는 3D 그래픽(WebGL 2)을 지원하지 않아요. 아래 정보와 2D 운지표로 학습할 수 있어요.");
} else {
  try {
    const [THREE, orbit, room, rounded] = await Promise.all([
      import("./vendor/three-0.170.0/three.module.min.js"),
      import("./vendor/three-0.170.0/addons/OrbitControls.js"),
      import("./vendor/three-0.170.0/addons/RoomEnvironment.js"),
      import("./vendor/three-0.170.0/addons/RoundedBoxGeometry.js")
    ]);
    viewer = createViewer(THREE, {
      OrbitControls: orbit.OrbitControls, RoomEnvironment: room.RoomEnvironment, RoundedBoxGeometry: rounded.RoundedBoxGeometry
    }, $("stage3d"));
    viewer.onUserCamera(() => { if (state.region !== "free") setRegion("free"); });
    viewer.keepFramingWhen(() => state.region !== "free");
  } catch (error) {
    console.error("3D 초기화 실패:", error);
    viewer = null;
    window.__flute3d.failed = true;
    window.flute3dFail("3D 화면을 준비하지 못했어요. 2D 운지표를 이용해 주세요.");
  }
}

selectNote(start.id, { source:"deep-link", altIndex:start.alt, announce:false });
if (viewer){
  viewer.frame("hands", true);
  viewer.snap();
  $("stage-status").hidden = true;
  window.__flute3d.ready = true;
}
window.__flute3d.selectNote = selectNote;
window.__flute3d.state = state;
window.__flute3d.viewer = viewer;
</script>

if ("serviceWorker" in navigator && (location.protocol === "https:" || ["localhost","127.0.0.1"].includes(location.hostname))){
  navigator.serviceWorker.register("./sw.js").catch(function (){});
}
</script>
