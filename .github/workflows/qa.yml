name: QA

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  data-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 2D·3D 운지 데이터 동기화 검사
        run: node qa/check-3d-data.mjs
